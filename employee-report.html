<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>nVent Hoffman — Attendance Report</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f4;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px;}
    #root{width:100%;max-width:480px;}
    button{font-family:inherit;font-size:14px;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;width:100%;margin-top:8px;font-weight:500;}
    button.primary{background:#E2001A;color:#fff;}
    button.primary:hover{background:#b8001a;}
    button.secondary{background:#404040;color:#fff;}
    button.secondary:hover{background:#555;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;color:#1a1a2e;background:#fff;width:100%;outline:none;transition:border-color .15s;}
    input:focus,select:focus{border-color:#E2001A;box-shadow:0 0 0 3px rgba(226,0,26,.1);}
    label{display:block;font-size:13px;color:#404040;margin-bottom:5px;font-weight:500;}
    .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:16px;}
    .header{background:#404040;border-radius:12px;padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
    .logo{height:44px;object-fit:contain;filter:brightness(0) invert(1);}
    .header-text h1{color:#fff;font-size:16px;font-weight:600;margin:0;}
    .header-text p{color:#aaa;font-size:12px;margin:0;margin-top:2px;}
    .field{margin-bottom:16px;}
    .step-indicator{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
    .step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
    .step.active{background:#E2001A;color:#fff;}
    .step.done{background:#404040;color:#fff;}
    .step.pending{background:#e5e7eb;color:#9ca3af;}
    .step-line{flex:1;height:2px;background:#e5e7eb;}
    .step-line.done{background:#404040;}
    .confirm-box{background:#ecfdf5;border:1px solid #6ee7b7;border-radius:10px;padding:20px;text-align:center;}
    .confirm-box h2{color:#065f46;font-size:18px;margin-bottom:8px;}
    .confirm-box p{color:#047857;font-size:14px;}
    .confirm-detail{background:#f9fafb;border-radius:8px;padding:12px;margin-top:12px;text-align:left;}
    .confirm-detail p{font-size:13px;color:#404040;margin-bottom:6px;}
    .confirm-detail p span{font-weight:600;}
    .badge-yes{display:inline-block;background:#ecfdf5;color:#065f46;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;}
    .badge-no{display:inline-block;background:#fef2f2;color:#991b1b;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;}
    .error{color:#991b1b;font-size:12px;margin-top:4px;}
    .radio-group{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
    .radio-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;}
    .radio-opt:hover{border-color:#E2001A;background:#fff5f5;}
    .radio-opt.selected{border-color:#E2001A;background:#fff5f5;}
    .radio-opt input{width:16px;height:16px;accent-color:#E2001A;flex-shrink:0;}
    .radio-opt span{font-size:13px;color:#404040;}
    .hours-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;font-size:12px;color:#1d4ed8;margin-bottom:14px;}
  </style>
</head>

CC";

const DEPARTMENTS = ["Molding","VJ Assembly","CNC","Gasket","Paint"];
const ATT_TYPES   = ["Absent - Full Day","Late Arrival","Left Early","Late Arrival & Left Early"];
const ABS_REASONS = ["Sick","No Call / No Show","Personal","Approved Leave","Other"];
const LATE_REASONS= ["Traffic / Car Issues","Personal Reason","Appointment","Other"];

async function fetchEmployees(dept) {
  try {
    const u = new URL(GAS_URL);
    u.searchParams.set("action","getEmployeesByDept");
    u.searchParams.set("department",dept);
    const res = await fetch(u.toString(),{redirect:"follow"});
    return (await res.json()).employees || [];
  } catch { return []; }
}

async function submitReport(data) {
  try {
    const u = new URL(GAS_URL);
    u.searchParams.set("action","submitEmployeeReport");
    u.searchParams.set("data",JSON.stringify(data));
    const res = await fetch(u.toString(),{redirect:"follow"});
    return await res.json();
  } catch(e) { return {success:false,error:e.message}; }
}

function App() {
  const [step,       setStep]       = useState(1);
  const [dept,       setDept]       = useState("");
  const [employees,  setEmps]       = useState([]);
  const [empLoading, setEmpLoad]    = useState(false);
  const [empName,    setEmpName]    = useState("");
  const [attType,    setAttType]    = useState("");
  const [reason,     setReason]     = useState("");
  const [absDate,    setAbsDate]    = useState(new Date().toISOString().split("T")[0]);
  const [hoursLost,  setHoursLost]  = useState("");
  const [isTemp,     setIsTemp]     = useState("");
  const [workday,    setWorkday]    = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [submitted,  setSubmitted]  = useState(false);
  const [error,      setError]      = useState("");
  const [submitTime, setSubmitTime] = useState("");

  useEffect(()=>{
    if(!dept) return;
    setEmpLoad(true); setEmpName("");
    fetchEmployees(dept).then(e=>{ setEmps(e); setEmpLoad(false); });
  },[dept]);

  const isAbsent     = attType === "Absent - Full Day";
  const isLateOrLeft = ["Late Arrival","Left Early","Late Arrival & Left Early"].includes(attType);

  const canNext1 = dept && empName;
  const canNext2 = attType && reason && absDate && (isAbsent || (isLateOrLeft && hoursLost));
  const canNext3 = isTemp !== "" && (isTemp === "Temp" || workday !== "");

  const handleSubmit = async () => {
    setSubmitting(true); setError("");
    const now = new Date();
    const data = {
      submittedAt: now.toISOString(),
      department: dept, name: empName,
      attType, reason,
      absDate,
      hoursLost: isAbsent ? "8" : hoursLost,
      isTemp,
      workday: isTemp==="Full-Time" ? workday : "N/A",
      device: navigator.userAgent.substring(0,120),
      status: "Pending"
    };
    const res = await submitReport(data);
    setSubmitting(false);
    if(res?.success){
      setSubmitTime(now.toLocaleString("en-US",{month:"numeric",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"}));
      setSubmitted(true);
    } else setError(res?.error || "Submission failed. Please try again.");
  };

  const steps = [{n:1,label:"Who"},{n:2,label:"Attendance"},{n:3,label:"Status"},{n:4,label:"Review"}];

  if(submitted) return (
    <div>
      <div className="header">
        <img src={NVENT_LOGO} className="logo" alt="nVent"/>
        <div className="header-text"><h1>Attendance Report</h1><p>nVent Hoffman — 2nd Shift</p></div>
      </div>
      <div className="confirm-box">
        <div style={{fontSize:48,marginBottom:8}}>✅</div>
        <h2>Report Submitted</h2>
        <p>Your supervisor has been notified and will review your submission.</p>
        <div className="confirm-detail">
          <p>Name: <span>{empName}</span></p>
          <p>Department: <span>{dept}</span></p>
          <p>Date: <span>{absDate}</span></p>
          <p>Type: <span>{attType}</span></p>
          <p>Hours lost: <span>{isAbsent?"8":hoursLost}h</span></p>
          <p>Reason: <span>{reason}</span></p>
          {isTemp==="Full-Time"&&<p>Workday submitted: <span>{workday}</span></p>}
          <p style={{marginTop:8,fontSize:11,color:"#9ca3af"}}>Submitted at {submitTime}</p>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      <div className="header">
        <img src={NVENT_LOGO} className="logo" alt="nVent"/>
        <div className="header-text"><h1>Attendance Report</h1><p>nVent Hoffman — 2nd Shift</p></div>
      </div>

      <div className="card">
        <div className="step-indicator">
          {steps.map((s,i)=>(
            <React.Fragment key={s.n}>
              <div className={`step ${step===s.n?"active":step>s.n?"done":"pending"}`}>{step>s.n?"✓":s.n}</div>
              {i<steps.length-1&&<div className={`step-line ${step>s.n?"done":""}`}/>}
            </React.Fragment>
          ))}
        </div>

        {/* STEP 1 — Who */}
        {step===1&&(
          <div>
            <h2 style={{fontSize:16,fontWeight:600,marginBottom:16,color:"#404040"}}>Who are you?</h2>
            <div className="field">
              <label>Department</label>
              <select value={dept} onChange={e=>{setDept(e.target.value);setEmpName("");}}>
                <option value="">Select department...</option>
                {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            </div>
            {dept&&(
              <div className="field">
                <label>Your name</label>
                {empLoading
                  ?<select disabled><option>Loading...</option></select>
                  :<select value={empName} onChange={e=>setEmpName(e.target.value)}>
                    <option value="">Select your name...</option>
                    {employees.map(e=><option key={e.eid} value={e.name}>{e.name}</option>)}
                  </select>
                }
              </div>
            )}
            <button className="primary" disabled={!canNext1} onClick={()=>setStep(2)}>Next →</button>
          </div>
        )}

        {/* STEP 2 — Attendance */}
        {step===2&&(
          <div>
            <h2 style={{fontSize:16,fontWeight:600,marginBottom:4,color:"#404040"}}>Attendance details</h2>
            <p style={{fontSize:12,color:"#9ca3af",marginBottom:16}}>{empName} — {dept}</p>

            <div className="field">
              <label>Date of absence</label>
              <input type="date" value={absDate} onChange={e=>setAbsDate(e.target.value)}
                max={new Date().toISOString().split("T")[0]}/>
            </div>

            <div className="field">
              <label>Type</label>
              <div className="radio-group">
                {ATT_TYPES.map(t=>(
                  <label key={t} className={`radio-opt ${attType===t?"selected":""}`}>
                    <input type="radio" name="attType" value={t} checked={attType===t}
                      onChange={()=>{setAttType(t);setReason("");setHoursLost(t==="Absent - Full Day"?"8":"");}}/>
                    <span>{t}{t==="Absent - Full Day"?" — 8 hours automatically":""}</span>
                  </label>
                ))}
              </div>
            </div>

            {attType&&(
              <>
                <div className="field">
                  <label>Reason</label>
                  <select value={reason} onChange={e=>setReason(e.target.value)}>
                    <option value="">Select reason...</option>
                    {(isAbsent?ABS_REASONS:LATE_REASONS).map(r=><option key={r} value={r}>{r}</option>)}
                  </select>
                </div>

                {isLateOrLeft&&(
                  <div className="field">
                    <label>How many hours did you miss?</label>
                    <div className="info-box">Enter the number of hours you were not at work. For example, if you arrived 2 hours late, enter 2.</div>
                    <div className="hours-row">
                      <input type="number" min="0.5" max="7.5" step="0.5" value={hoursLost}
                        onChange={e=>setHoursLost(e.target.value)} placeholder="e.g. 2"/>
                      <select value={hoursLost} onChange={e=>setHoursLost(e.target.value)}>
                        <option value="">Quick select...</option>
                        {["0.5","1","1.5","2","2.5","3","3.5","4","4.5","5","5.5","6","6.5","7","7.5"].map(h=>(
                          <option key={h} value={h}>{h} hour{h!=="1"?"s":""}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                )}
                {isAbsent&&(
                  <div style={{background:"#fef2f2",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#991b1b",marginBottom:14}}>
                    Full day absence — 8 hours will be recorded automatically
                  </div>
                )}
              </>
            )}

            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button className="secondary" onClick={()=>setStep(1)} style={{width:"auto",flex:1}}>← Back</button>
              <button className="primary" disabled={!canNext2} onClick={()=>setStep(3)} style={{flex:2}}>Next →</button>
            </div>
          </div>
        )}

        {/* STEP 3 — Status */}
        {step===3&&(
          <div>
            <h2 style={{fontSize:16,fontWeight:600,marginBottom:4,color:"#404040"}}>Employment status</h2>
            <p style={{fontSize:12,color:"#9ca3af",marginBottom:16}}>{empName} — {attType} on {absDate}</p>
            <div className="field">
              <label>Are you a temp or full-time employee?</label>
              <div className="radio-group">
                {["Temp","Full-Time"].map(t=>(
                  <label key={t} className={`radio-opt ${isTemp===t?"selected":""}`}>
                    <input type="radio" name="empType" value={t} checked={isTemp===t}
                      onChange={()=>{setIsTemp(t);setWorkday("");}}/>
                    <span>{t}</span>
                  </label>
                ))}
              </div>
            </div>
            {isTemp==="Full-Time"&&(
              <div className="field">
                <label>Have you submitted your time in Workday?</label>
                <div className="radio-group">
                  {["Yes","No"].map(v=>(
                    <label key={v} className={`radio-opt ${workday===v?"selected":""}`}>
                      <input type="radio" name="workday" value={v} checked={workday===v}
                        onChange={()=>setWorkday(v)}/>
                      <span>{v}{v==="No"?" — I will do it as soon as possible":""}</span>
                    </label>
                  ))}
                </div>
              </div>
            )}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button className="secondary" onClick={()=>setStep(2)} style={{width:"auto",flex:1}}>← Back</button>
              <button className="primary" disabled={!canNext3} onClick={()=>setStep(4)} style={{flex:2}}>Review →</button>
            </div>
          </div>
        )}

        {/* STEP 4 — Review */}
        {step===4&&(
          <div>
            <h2 style={{fontSize:16,fontWeight:600,marginBottom:16,color:"#404040"}}>Review and submit</h2>
            <div className="confirm-detail" style={{marginTop:0,marginBottom:16}}>
              <p>Name: <span>{empName}</span></p>
              <p>Department: <span>{dept}</span></p>
              <p>Date: <span>{absDate}</span></p>
              <p>Attendance type: <span>{attType}</span></p>
              <p>Hours lost: <span>{isAbsent?"8 (full day)":hoursLost+"h"}</span></p>
              <p>Reason: <span>{reason}</span></p>
              <p>Employment: <span>{isTemp}</span></p>
              {isTemp==="Full-Time"&&(
                <p>Workday submitted: <span className={workday==="Yes"?"badge-yes":"badge-no"}>{workday}</span></p>
              )}
            </div>
            <p style={{fontSize:12,color:"#9ca3af",marginBottom:12}}>By submitting you confirm this information is accurate. Your supervisor will be notified immediately.</p>
            {error&&<p className="error" style={{marginBottom:8}}>{error}</p>}
            <div style={{display:"flex",gap:8}}>
              <button className="secondary" onClick={()=>setStep(3)} style={{width:"auto",flex:1}}>← Back</button>
              <button className="primary" disabled={submitting} onClick={handleSubmit} style={{flex:2}}>
                {submitting?"Submitting...":"Submit Report"}
              </button>
            </div>
          </div>
        )}
      </div>

      <p style={{fontSize:11,color:"#9ca3af",textAlign:"center"}}>nVent Hoffman — 2nd Shift Attendance System</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
