<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workforce Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#1a1a2e;min-height:100vh;}
    #root{max-width:1280px;margin:0 auto;padding:0 20px 40px;}

    button{font-family:inherit;font-size:13px;padding:7px 14px;border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s;}
    button:hover{background:#f9fafb;border-color:#b0b7c3;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    button.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8;}
    button.primary:hover{background:#1e40af;}
    button.danger{color:#b91c1c;border-color:#fca5a5;}
    button.danger:hover{background:#fef2f2;}
    button.amber{color:#92400e;border-color:#fde68a;background:#fffbeb;}
    button.amber:hover{background:#fef3c7;}
    button.success{color:#065f46;border-color:#6ee7b7;background:#ecfdf5;}

    input,select{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #d0d5dd;border-radius:8px;color:#1a1a2e;background:#fff;width:100%;outline:none;transition:border-color .15s;}
    input:focus,select:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.1);}
    input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:#1d4ed8;}
    input[type="number"]{width:80px;}
    input[type="password"]{letter-spacing:2px;}

    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;}
    .nav{display:flex;align-items:center;gap:4px;border-bottom:1px solid #e5e7eb;margin-bottom:24px;padding-top:20px;}
    .nav-btn{border:none;border-radius:8px 8px 0 0;border-bottom:2px solid transparent;padding:10px 16px;font-size:14px;background:transparent;margin-bottom:-1px;}
    .nav-btn.active{border-bottom:2px solid #1d4ed8;color:#1d4ed8;font-weight:500;}

    .ts-header{display:grid;grid-template-columns:1.8fr 0.8fr 1fr 100px 190px 200px;gap:8px;padding:10px 16px;font-size:11px;color:#6b7280;font-weight:600;letter-spacing:.5px;border-bottom:1px solid #e5e7eb;}
    .ts-row{display:grid;grid-template-columns:1.8fr 0.8fr 1fr 100px 190px 200px;gap:8px;padding:10px 16px;align-items:center;font-size:13px;}
    .ts-row:nth-child(even){background:#f9fafb;}

    .toast{position:fixed;bottom:24px;right:24px;z-index:999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.12);}
    .toast.success{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;}
    .toast.error{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
    .modal{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}

    .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
    .badge.green{background:#ecfdf5;color:#065f46;}
    .badge.red{background:#fef2f2;color:#991b1b;}
    .badge.blue{background:#eff6ff;color:#1d4ed8;}
    .badge.amber{background:#fffbeb;color:#92400e;}
    .badge.today{background:#fef3c7;color:#92400e;}
    .badge.gray{background:#f3f4f6;color:#6b7280;}

    .prog-track{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden;}
    .prog-fill{height:5px;border-radius:3px;transition:width .5s ease;}

    .emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
    .emp-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
    .emp-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:#93c5fd;}
    .emp-card.inactive{opacity:.6;}
    .dept-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
    .dept-card{background:#f9fafb;border-radius:10px;padding:14px;}
    .avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}

    .setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:14px;}
    .setup-icon{width:60px;height:60px;border-radius:16px;background:#dbeafe;display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
    label.field{display:block;font-size:12px;color:#6b7280;margin-bottom:5px;font-weight:500;text-align:left;}

    .att-section{border-radius:10px;padding:14px;margin-bottom:14px;}
    .att-section.abs-sec{background:#fef2f2;border:1px solid #fecaca;}
    .att-section.late-sec{background:#fffbeb;border:1px solid #fde68a;}
    .att-section.cov-sec{background:#ecfdf5;border:1px solid #6ee7b7;}
    .att-title{font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
    .att-row{display:grid;grid-template-columns:20px 90px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);}
    .att-row:last-child{border-bottom:none;}

    .dp-abs{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;}
    .dp-late{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
    .dp-cov{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;}

    .divider{display:flex;align-items:center;gap:12px;margin:28px 0 16px;}
    .divider-line{flex:1;height:1px;background:#e5e7eb;}
    .divider-label{font-size:11px;color:#9ca3af;font-weight:600;letter-spacing:.6px;white-space:nowrap;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

// ── Config — paste your GAS URL here ──────────────────────────────────────
const GAS_URL = "PASTE_YOUR_GAS_URL_HERE";
if (GAS_URL && GAS_URL !== "PASTE_YOUR_GAS_URL_HERE" && !localStorage.getItem("wt_gasUrl"))
  localStorage.setItem("wt_gasUrl", GAS_URL);

// ── Constants ─────────────────────────────────────────────────────────────
const DEPARTMENTS  = ["Molding","VJ Assembly","CNC","Gasket","Paint"];
const DAYS         = ["monday","tuesday","wednesday","thursday","friday"];
const DAY_LABELS   = {monday:"Mon",tuesday:"Tue",wednesday:"Wed",thursday:"Thu",friday:"Fri"};
const ABS_REASONS  = ["Sick","No Call / No Show","Personal","Approved Leave","Other"];
const LATE_REASONS = ["Late Arrival","Left Early","Late Arrival & Left Early"];
const TERM_REASONS = ["Resigned","Terminated","Contract Ended","Retired","Other"];
const SHIFT_HOURS  = 8;
const SESSION_KEY  = "wt_session";
const TIMEOUT_MS   = 8 * 60 * 60 * 1000;

// ── Session helpers ───────────────────────────────────────────────────────
function getSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (!s) return null;
    if (Date.now() - s.lastActivity > TIMEOUT_MS) { localStorage.removeItem(SESSION_KEY); return null; }
    return s;
  } catch { return null; }
}
function saveSession(data) { localStorage.setItem(SESSION_KEY, JSON.stringify({...data, lastActivity:Date.now()})); }
function touchSession()    { const s=getSession(); if(s) saveSession(s); }

// ── Helpers ───────────────────────────────────────────────────────────────
function getWeekEnd(offset=0) {
  const d=new Date(), sat=new Date(d);
  sat.setDate(d.getDate()+(6-d.getDay())+offset*7);
  sat.setHours(0,0,0,0); return sat;
}
function getWeekDates(sat) {
  return DAYS.map((_,i)=>{ const d=new Date(sat); d.setDate(sat.getDate()-5+i); return d.toLocaleDateString("en-US",{month:"numeric",day:"numeric"}); });
}
function fmtDate(iso) {
  if (!iso) return "—"; const p=String(iso).split("-"); return p.length<3?(iso||"—"):`${p[1]}/${p[2]}/${p[0]}`;
}
function daysUntilBirthday(bday) {
  if(!bday) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const p=String(bday).split("-"); if(p.length<3) return null;
  const next=new Date(today.getFullYear(),+p[1]-1,+p[2]);
  if(next<today) next.setFullYear(today.getFullYear()+1);
  return Math.round((next-today)/86400000);
}
function initials(name="") { return name.trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase(); }
function calcHoursLost(abs) {
  let h=0;
  DAYS.forEach(d=>{
    if(abs[`${d}_absent`]&&abs[`${d}_absent`]!=="") h+=SHIFT_HOURS;
    const lh=parseFloat(abs[`${d}_lateHours`]);
    if(!isNaN(lh)&&lh>0&&lh<=SHIFT_HOURS) h+=lh;
  });
  return Math.round(h*10)/10;
}
function calcCoverage(coverages) {
  const out={},inp={};
  DEPARTMENTS.forEach(d=>{out[d]=0;inp[d]=0;});
  coverages.forEach(c=>{
    DAYS.forEach(day=>{
      const toDept=c[`${day}_toDept`];
      const h=parseFloat(c[`${day}_hours`]);
      if(toDept&&!isNaN(h)&&h>0&&h<=SHIFT_HOURS){
        if(out[c.fromDept]!==undefined) out[c.fromDept]+=h;
        if(inp[toDept]!==undefined) inp[toDept]+=h;
      }
    });
  });
  return {out,inp};
}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  // Auth
  const [session,      setSessionSt]   = useState(()=>getSession());
  const [loginForm,    setLoginForm]   = useState({username:"",password:""});
  const [loginError,   setLoginError]  = useState("");
  const [loginLoading, setLoginLoad]   = useState(false);
  const [timedOut,     setTimedOut]    = useState(false);

  // Setup
  const [urlDraft,  setUrlDraft]  = useState("");
  const [setupDone, setSetupDone] = useState(!!localStorage.getItem("wt_gasUrl"));

  // Data
  const [tab,       setTab]       = useState("dashboard");
  const [employees, setEmployees] = useState([]);
  const [timesheets,setTimesheets]= useState([]);
  const [absences,  setAbsences]  = useState([]);
  const [coverages, setCoverages] = useState([]);
  const [weekOff,   setWeekOff]   = useState(0);
  const [loading,   setLoading]   = useState(false);
  const [toast,     setToast]     = useState(null);
  const [sending,   setSending]   = useState(false);

  // Modals
  const [modal,          setModal]          = useState(null);
  const [form,           setForm]           = useState({});
  const [absModal,       setAbsModal]       = useState(null);
  const [absForm,        setAbsForm]        = useState({});
  const [termModal,      setTermModal]      = useState(null);
  const [termForm,       setTermForm]       = useState({});
  const [covModal,       setCovModal]       = useState(null);
  const [covForm,        setCovForm]        = useState({});
  const [profileEmp,     setProfileEmp]     = useState(null);
  const [profileAbs,     setProfileAbs]     = useState([]);
  const [profileTermData,setProfileTermData]= useState(null);
  const [profileLoad,    setProfileLoad]    = useState(false);

  const toastTimer = useRef(null);
  const weekEnd    = getWeekEnd(weekOff);
  const weekEndStr = weekEnd.toISOString().split("T")[0];
  const weekDates  = getWeekDates(weekEnd);
  const isAdmin    = session?.role === "Admin";

  // Inactivity timeout
  useEffect(()=>{
    if(!session) return;
    const touch = ()=>touchSession();
    document.addEventListener("click",touch);
    document.addEventListener("keydown",touch);
    const iv = setInterval(()=>{ if(!getSession()){ localStorage.removeItem(SESSION_KEY); setSessionSt(null); setTimedOut(true); }}, 60000);
    return ()=>{ document.removeEventListener("click",touch); document.removeEventListener("keydown",touch); clearInterval(iv); };
  },[session]);

  const notify=(msg,type="success")=>{
    clearTimeout(toastTimer.current);
    setToast({msg,type});
    toastTimer.current=setTimeout(()=>setToast(null),3500);
  };

  const call=useCallback(async(params)=>{
    const url=localStorage.getItem("wt_gasUrl");
    if(!url) return null;
    try {
      const u=new URL(url);
      Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,typeof v==="object"?JSON.stringify(v):String(v)));
      const res=await fetch(u.toString(),{redirect:"follow"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      return await res.json();
    } catch(e){ notify("Connection error: "+e.message,"error"); return null; }
  },[]);

  // Auth actions
  const doLogin=async()=>{
    if(!loginForm.username||!loginForm.password){setLoginError("Enter username and password");return;}
    setLoginLoad(true); setLoginError("");
    const res=await call({action:"verifyLogin",username:loginForm.username,password:loginForm.password});
    setLoginLoad(false);
    if(res?.success){
      const s={username:res.username,role:res.role,lastActivity:Date.now()};
      saveSession(s); setSessionSt(s); setTimedOut(false);
    } else setLoginError(res?.error||"Invalid username or password");
  };
  const logout=()=>{ localStorage.removeItem(SESSION_KEY); setSessionSt(null); setTimedOut(false); };

  // Data loaders
  const loadEmployees =useCallback(async()=>{ setLoading(true); const d=await call({action:"getEmployees"}); if(d?.employees) setEmployees(d.employees); setLoading(false); },[call]);
  const loadTimesheets=useCallback(async()=>{ const d=await call({action:"getTimesheets",weekEnd:weekEndStr}); if(d?.timesheets) setTimesheets(d.timesheets); },[call,weekEndStr]);
  const loadAbsences  =useCallback(async()=>{ const d=await call({action:"getAbsences",weekEnd:weekEndStr}); if(d?.absences) setAbsences(d.absences); },[call,weekEndStr]);
  const loadCoverages =useCallback(async()=>{ const d=await call({action:"getCoverage",weekEnd:weekEndStr}); if(d?.coverages) setCoverages(d.coverages); },[call,weekEndStr]);

  useEffect(()=>{ if(session&&setupDone) loadEmployees(); },[session,setupDone]);
  useEffect(()=>{ if(session&&setupDone){ loadTimesheets(); loadAbsences(); loadCoverages(); } },[session,setupDone,weekEndStr]);

  // Employee actions
  const saveEmployee=async()=>{
    if(!form.name||!form.eid||!form.department){notify("Name, EID, Department required","error");return;}
    const res=await call({action:modal==="edit"?"updateEmployee":"addEmployee",data:{...form,status:form.status||"Active"}});
    if(res?.success){notify(modal==="edit"?"Employee updated":"Employee added");setModal(null);loadEmployees();}
    else notify(res?.error||"Save failed","error");
  };
  const deleteEmployee=async(eid,name)=>{
    if(!confirm(`Remove ${name}?`)) return;
    const res=await call({action:"deleteEmployee",eid});
    if(res?.success){notify("Employee removed");loadEmployees();}
  };
  const openTerminate=emp=>{
    setTermModal(emp);
    setTermForm({lastDay:new Date().toISOString().split("T")[0],reason:"Resigned",rehireEligible:"Yes",notes:""});
  };
  const saveTerminate=async()=>{
    if(!termForm.lastDay){notify("Last day is required","error");return;}
    const res=await call({action:"terminateEmployee",data:{eid:termModal.eid,name:termModal.name,department:termModal.department,...termForm,terminatedAt:new Date().toISOString()}});
    if(res?.success){notify(`${termModal.name} marked inactive`);setTermModal(null);loadEmployees();}
    else notify("Failed","error");
  };
  const reactivate=async(eid,name)=>{
    if(!confirm(`Reactivate ${name}?`)) return;
    const res=await call({action:"reactivateEmployee",eid});
    if(res?.success){notify(`${name} reactivated`);loadEmployees();}
  };

  // Timesheet
  const tsFor =eid=>timesheets.find(t=>t.eid===eid)||{};
  const absFor=eid=>absences.find(a=>a.eid===eid)||{};
  const covFor=eid=>coverages.find(c=>c.fromEid===eid)||{};

  const saveTs=async(emp,patch)=>{
    const cur=tsFor(emp.eid);
    const data={weekEnd:weekEndStr,eid:emp.eid,name:emp.name,department:emp.department,submitted:cur.submitted??false,submittedAt:cur.submittedAt??"",...patch};
    if(patch.submitted===true&&!cur.submitted) data.submittedAt=new Date().toISOString();
    if(patch.submitted===false) data.submittedAt="";
    const res=await call({action:"submitTimesheet",data});
    if(res?.success) loadTimesheets(); else notify("Save failed","error");
  };

  // Absence modal
  const openAbsModal=emp=>{
    const cur=absFor(emp.eid); const f={};
    DAYS.forEach(d=>{ f[`${d}_absent`]=cur[`${d}_absent`]||""; f[`${d}_lateReason`]=cur[`${d}_lateReason`]||""; f[`${d}_lateHours`]=cur[`${d}_lateHours`]||""; });
    setAbsForm(f); setAbsModal(emp);
  };
  const saveAbsences=async()=>{
    const res=await call({action:"saveAbsences",data:{weekEnd:weekEndStr,eid:absModal.eid,name:absModal.name,department:absModal.department,loggedAt:new Date().toISOString(),...absForm}});
    if(res?.success){notify("Attendance logged");setAbsModal(null);loadAbsences();} else notify("Save failed","error");
  };

  // Coverage modal
  const openCovModal=emp=>{
    const cur=covFor(emp.eid); const f={};
    DAYS.forEach(d=>{ f[`${d}_toDept`]=cur[`${d}_toDept`]||""; f[`${d}_hours`]=cur[`${d}_hours`]||""; });
    setCovForm(f); setCovModal(emp);
  };
  const saveCoverage=async()=>{
    const res=await call({action:"saveCoverage",data:{weekEnd:weekEndStr,fromEid:covModal.eid,fromName:covModal.name,fromDept:covModal.department,loggedAt:new Date().toISOString(),...covForm}});
    if(res?.success){notify("Coverage logged");setCovModal(null);loadCoverages();} else notify("Save failed","error");
  };

  // Profile
  const openProfile=async emp=>{
    setProfileEmp(emp); setProfileAbs([]); setProfileTermData(null); setProfileLoad(true);
    const [absD,termD]=await Promise.all([call({action:"getAllAbsences",eid:emp.eid}),call({action:"getTermination",eid:emp.eid})]);
    if(absD?.absences) setProfileAbs(absD.absences);
    if(termD?.termination) setProfileTermData(termD.termination);
    setProfileLoad(false);
  };

  const sendReminder=async()=>{
    setSending(true);
    const res=await call({action:"sendReminder",weekEnd:weekEndStr});
    setSending(false);
    if(res?.success) notify("Reminder sent!"); else notify("Failed to send","error");
  };

  // Computed
  const active     = employees.filter(e=>!e.status||e.status==="Active"||e.status==="");
  const inactive   = employees.filter(e=>e.status==="Inactive");
  const submitted  = new Set(timesheets.filter(t=>t.submitted===true||t.submitted==="TRUE").map(t=>t.eid));
  const unsub      = active.filter(e=>!submitted.has(e.eid));
  const pct        = active.length?Math.round((submitted.size/active.length)*100):0;
  const birthdays  = active.map(e=>({...e,days:daysUntilBirthday(e.birthday)})).filter(e=>e.days!==null&&e.days<=7).sort((a,b)=>a.days-b.days);
  const totalLost  = absences.reduce((s,a)=>s+calcHoursLost(a),0);
  const totalAbsD  = absences.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="").length,0);
  const totalLateD = absences.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_lateReason`]&&a[`${d}_lateReason`]!=="").length,0);
  const {out:covOut,inp:covInp} = calcCoverage(coverages);

  // ── Setup screen ──────────────────────────────────────────────────────
  if(!setupDone) return (
    <div className="setup">
      <div className="setup-icon"><i className="ti ti-building-factory-2" style={{fontSize:30,color:"#1d4ed8"}}/></div>
      <h1 style={{fontSize:24,fontWeight:600}}>Workforce Tracker</h1>
      <p style={{color:"#6b7280",fontSize:14,maxWidth:380}}>Paste your Google Apps Script web app URL to connect your Google Sheet.</p>
      <div style={{display:"flex",gap:8,width:"100%",maxWidth:520}}>
        <input value={urlDraft} onChange={e=>setUrlDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(()=>{localStorage.setItem("wt_gasUrl",urlDraft.trim());setSetupDone(true);})()} placeholder="https://script.google.com/macros/s/..."/>
        <button className="primary" onClick={()=>{localStorage.setItem("wt_gasUrl",urlDraft.trim());setSetupDone(true);}}>Connect</button>
      </div>
    </div>
  );

  // ── Login screen ──────────────────────────────────────────────────────
  if(!session) return (
    <div className="setup">
      <div className="setup-icon"><i className="ti ti-lock" style={{fontSize:30,color:"#1d4ed8"}}/></div>
      <h1 style={{fontSize:24,fontWeight:600}}>Workforce Tracker</h1>
      {timedOut&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:"10px 18px",fontSize:13,color:"#92400e"}}>
        Session expired after 8 hours of inactivity
      </div>}
      <div style={{width:"100%",maxWidth:340,display:"flex",flexDirection:"column",gap:12}}>
        <div><label className="field">Username</label><input value={loginForm.username} onChange={e=>setLoginForm(p=>({...p,username:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doLogin()} placeholder="Username" autoFocus/></div>
        <div><label className="field">Password</label><input type="password" value={loginForm.password} onChange={e=>setLoginForm(p=>({...p,password:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doLogin()} placeholder="Password"/></div>
        {loginError&&<p style={{fontSize:13,color:"#991b1b",textAlign:"center"}}>{loginError}</p>}
        <button className="primary" onClick={doLogin} disabled={loginLoading} style={{width:"100%",justifyContent:"center",padding:"10px"}}>
          {loginLoading?"Signing in...":"Sign in"}
        </button>
      </div>

                const dAbs=absences.filter(a=>a.department===dept).reduce((s,a)=>s+calcHoursLost(a),0);

                      <div style={{minWidth:0,flex:1}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:4}}>
                          <p style={{margin:0,fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{emp.name}</p>
                          <span className="badge gray" style={{flexShrink:0}}>Inactive</span>
                        </div>
                        <p style={{margin:0,fontSize:11,color:"#9ca3af"}}>{emp.department} · {emp.eid}</p>
                      </div>

                      onClick={e=>{e.stopPropagation();reactivate(emp.eid,emp.name);}}>

              const lateDays=DAYS.filter(d=>abs[`${d}_lateReason`]&&abs[`${d}_lateReason`]!=="");
              const covDays=DAYS.filter(d=>cov[`${d}_toDept`]&&cov[`${d}_toDept`]!=="");
              const hLost=calcHoursLost(abs);
              return (
                <div key={emp.eid} className="ts-row">

                        {isAdmin&&<button style={{fontSize:11,padding:"2px 7px",marginLeft:2}} onClick={()=>openAbsModal(emp)}><i className="ti ti-edit" style={{fontSize:11}}/></button>}
                      </>

                      </>
                    }
                  </div>
                </div>
              );

            {active.length===0&&<p style={{padding:"24px 16px",color:"#9ca3af",fontSize:13}}>No active employees.</p>}
          </div>

              <button onClick={()=>setModal(null)} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              {[{f:"name",l:"Full name *",t:"text",span:2},{f:"eid",l:"EID *",t:"text"},{f:"jobTitle",l:"Job title",t:"text"},
                {f:"phone",l:"Phone",t:"tel"},{f:"email",l:"Email",t:"email"},{f:"hireDate",l:"Hire date",t:"date"},{f:"birthday",l:"Birthday",t:"date"}

              <div style={{gridColumn:"1/-1"}}><label className="field">Last day worked *</label><input type="date" value={termForm.lastDay||""} onChange={e=>setTermForm(p=>({...p,lastDay:e.target.value}))}/></div>

              <button className="amber" onClick={saveTerminate}><i className="ti ti-user-minus" style={{fontSize:13}}/> Mark inactive</button>

      {/* ── ATTENDANCE MODAL ── */}
      {absModal&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setAbsModal(null);}}>
          <div className="modal">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <h2 style={{fontSize:18,fontWeight:600}}>Log attendance</h2>
              <button onClick={()=>setAbsModal(null)} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
            </div>
            <p style={{fontSize:13,color:"#6b7280",marginBottom:20}}>
              <strong>{absModal.name}</strong> · {absModal.department}<br/>
              <span style={{fontSize:12}}>Week of {weekDates[0]} – {weekDates[4]}</span>
            </p>
            <div className="att-section abs-sec">
              <div className="att-title" style={{color:"#991b1b"}}><i className="ti ti-user-x" style={{fontSize:14}}/> ABSENT — full day (8 hrs lost automatically)</div>
              {DAYS.map((day,i)=>(
                <div key={`a${day}`} className="att-row">
                  <input type="checkbox" checked={!!absForm[`${day}_absent`]} onChange={e=>setAbsForm(p=>({...p,[`${day}_absent`]:e.target.checked?ABS_REASONS[0]:""}))}/>
                  <span style={{fontSize:13,fontWeight:600}}>{DAY_LABELS[day]} <span style={{fontWeight:400,color:"#9ca3af",fontSize:11}}>{weekDates[i]}</span></span>
                  {absForm[`${day}_absent`]
                    ?<select value={absForm[`${day}_absent`]} onChange={e=>setAbsForm(p=>({...p,[`${day}_absent`]:e.target.value}))}>
                        {ABS_REASONS.map(r=><option key={r} value={r}>{r}</option>)}
                      </select>
                    :<span style={{fontSize:12,color:"#d1d5db",fontStyle:"italic"}}>Present</span>}
                </div>
              ))}
            </div>
            <div className="att-section late-sec">
              <div className="att-title" style={{color:"#92400e"}}><i className="ti ti-clock-exclamation" style={{fontSize:14}}/> LATE / LEFT EARLY — enter hours lost</div>
              {DAYS.map((day,i)=>(
                <div key={`l${day}`} className="att-row">
                  <input type="checkbox" checked={!!absForm[`${day}_lateReason`]} onChange={e=>setAbsForm(p=>({...p,[`${day}_lateReason`]:e.target.checked?LATE_REASONS[0]:"",[`${day}_lateHours`]:e.target.checked?"1":""}))}/>
                  <span style={{fontSize:13,fontWeight:600}}>{DAY_LABELS[day]} <span style={{fontWeight:400,color:"#9ca3af",fontSize:11}}>{weekDates[i]}</span></span>
                  {absForm[`${day}_lateReason`]
                    ?<div style={{display:"flex",gap:6,alignItems:"center"}}>
                        <select value={absForm[`${day}_lateReason`]} onChange={e=>setAbsForm(p=>({...p,[`${day}_lateReason`]:e.target.value}))} style={{flex:1}}>
                          {LATE_REASONS.map(r=><option key={r} value={r}>{r}</option>)}
                        </select>
                        <input type="number" min="0.5" max="7.5" step="0.5" value={absForm[`${day}_lateHours`]||""} onChange={e=>setAbsForm(p=>({...p,[`${day}_lateHours`]:e.target.value}))} style={{width:55}} placeholder="hrs"/>
                        <span style={{fontSize:11,color:"#9ca3af"}}>h</span>
                      </div>
                    :<span style={{fontSize:12,color:"#d1d5db",fontStyle:"italic"}}>On time</span>}
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setAbsModal(null)}>Cancel</button>
              <button className="primary" onClick={saveAbsences}>Save</button>
            </div>
          </div>
        </div>
      )}

      {/* ── COVERAGE MODAL ── */}
      {covModal&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setCovModal(null);}}>
          <div className="modal">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <h2 style={{fontSize:18,fontWeight:600}}>Log coverage</h2>
              <button onClick={()=>setCovModal(null)} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
            </div>
            <p style={{fontSize:13,color:"#6b7280",marginBottom:20}}>
              <strong>{covModal.name}</strong> · {covModal.department}<br/>
              <span style={{fontSize:12}}>Week of {weekDates[0]} – {weekDates[4]} · Which dept did they cover and for how long?</span>
            </p>
            <div className="att-section cov-sec">
              <div className="att-title" style={{color:"#065f46"}}><i className="ti ti-arrow-left-right" style={{fontSize:14}}/> COVERAGE BY DAY</div>
              {DAYS.map((day,i)=>{
                const otherDepts=DEPARTMENTS.filter(d=>d!==covModal.department);
                return (
                  <div key={day} className="att-row">
                    <input type="checkbox" checked={!!covForm[`${day}_toDept`]} onChange={e=>setCovForm(p=>({...p,[`${day}_toDept`]:e.target.checked?otherDepts[0]:"",[`${day}_hours`]:e.target.checked?"8":""}))}/>
                    <span style={{fontSize:13,fontWeight:600}}>{DAY_LABELS[day]} <span style={{fontWeight:400,color:"#9ca3af",fontSize:11}}>{weekDates[i]}</span></span>
                    {covForm[`${day}_toDept`]
                      ?<div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <select value={covForm[`${day}_toDept`]} onChange={e=>setCovForm(p=>({...p,[`${day}_toDept`]:e.target.value}))} style={{flex:1}}>
                            {otherDepts.map(d=><option key={d} value={d}>{d}</option>)}
                          </select>
                          <input type="number" min="1" max="8" step="0.5" value={covForm[`${day}_hours`]||""} onChange={e=>setCovForm(p=>({...p,[`${day}_hours`]:e.target.value}))} style={{width:55}} placeholder="hrs"/>
                          <span style={{fontSize:11,color:"#9ca3af"}}>h</span>
                        </div>
                      :<span style={{fontSize:12,color:"#9ca3af",fontStyle:"italic"}}>Not covering</span>}
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={()=>setCovModal(null)}>Cancel</button>
              <button className="primary" onClick={saveCoverage}>Save coverage</button>
            </div>
          </div>
        </div>
      )}

      {/* ── PROFILE MODAL ── */}
      {profileEmp&&(()=>{
        const isInact=profileEmp.status==="Inactive";
        const totDays=profileAbs.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="").length,0);
        const totLate=profileAbs.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_lateReason`]&&a[`${d}_lateReason`]!=="").length,0);
        const totHrs =profileAbs.reduce((s,a)=>s+calcHoursLost(a),0);
        const rc={};
        profileAbs.forEach(a=>DAYS.forEach(d=>{ if(a[`${d}_absent`]&&a[`${d}_absent`]!=="") rc[a[`${d}_absent`]]=(rc[a[`${d}_absent`]]||0)+1; }));
        return (
          <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setProfileEmp(null);}}>
            <div className="modal" style={{maxWidth:540}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div className="avatar" style={{width:48,height:48,fontSize:16,background:isInact?"#f3f4f6":"#dbeafe",color:isInact?"#9ca3af":"#1d4ed8"}}>{initials(profileEmp.name)}</div>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <h2 style={{fontSize:18,fontWeight:600,margin:0}}>{profileEmp.name}</h2>
                      {isInact&&<span className="badge gray">Inactive</span>}
                    </div>
                    <p style={{margin:0,fontSize:12,color:"#6b7280"}}>{profileEmp.department} · EID: {profileEmp.eid}</p>
                  </div>
                </div>
                <button onClick={()=>setProfileEmp(null)} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,padding:14,background:"#f9fafb",borderRadius:10,marginBottom:16}}>
                {[["Job Title",profileEmp.jobTitle],["Phone",profileEmp.phone],["Hire Date",fmtDate(profileEmp.hireDate)],["Birthday",fmtDate(profileEmp.birthday)]]
                  .filter(([,v])=>v&&v!=="—").map(([l,v])=>(
                  <div key={l}><p style={{margin:0,fontSize:10,color:"#9ca3af",fontWeight:600,letterSpacing:.5}}>{l.toUpperCase()}</p><p style={{margin:0,fontSize:13}}>{v}</p></div>
                ))}
              </div>

              {isInact&&profileTermData&&(
                <div style={{padding:14,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,marginBottom:16}}>
                  <p style={{margin:"0 0 10px",fontSize:11,color:"#92400e",fontWeight:600,letterSpacing:.5}}>TERMINATION DETAILS</p>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {[["Last Day",fmtDate(profileTermData.lastDay)],["Reason",profileTermData.reason],
                      ["Rehire Eligible",profileTermData.rehireEligible],["Notes",profileTermData.notes||"—"]]
                      .map(([l,v])=>(
                      <div key={l} style={l==="Notes"?{gridColumn:"1/-1"}:{}}>
                        <p style={{margin:0,fontSize:10,color:"#92400e",fontWeight:600}}>{l.toUpperCase()}</p>
                        <p style={{margin:0,fontSize:13}}>{v}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <p style={{fontSize:11,color:"#9ca3af",fontWeight:600,letterSpacing:.6,marginBottom:12}}>ATTENDANCE HISTORY</p>
              {profileLoad
                ?<p style={{fontSize:13,color:"#9ca3af",textAlign:"center",padding:"20px 0"}}>Loading...</p>
                :totDays===0&&totLate===0
                  ?<div style={{textAlign:"center",padding:"20px 0",color:"#9ca3af"}}>
                      <i className="ti ti-circle-check" style={{fontSize:32,display:"block",marginBottom:8,color:"#10b981"}}/>
                      <p style={{fontSize:13}}>No absences on record</p>
                    </div>
                  :<>
                    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                      {[{l:"Absent days",v:totDays,bg:"#fef2f2",c:"#991b1b"},
                        {l:"Late/Left",v:totLate,bg:"#fffbeb",c:"#92400e"},
                        {l:"Hours lost",v:`${totHrs}h`,bg:"#f3f4f6",c:"#374151"},
                        ...Object.entries(rc).map(([r,c])=>({l:r,v:c,bg:"#fef2f2",c:"#991b1b"}))
                      ].map(({l,v,bg,c})=>(
                        <div key={l} style={{background:bg,borderRadius:10,padding:"8px 14px"}}>
                          <p style={{margin:0,fontSize:10,color:c,fontWeight:600}}>{l.toUpperCase()}</p>
                          <p style={{margin:0,fontSize:22,fontWeight:700,color:c}}>{v}</p>
                        </div>
                      ))}
                    </div>
                    <div style={{maxHeight:180,overflowY:"auto",display:"flex",flexDirection:"column",gap:8}}>
                      {[...profileAbs].reverse().map((a,i)=>{
                        const absDays=DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="");
                        const lateDays=DAYS.filter(d=>a[`${d}_lateReason`]&&a[`${d}_lateReason`]!=="");
                        if(!absDays.length&&!lateDays.length) return null;
                        return (
                          <div key={i} style={{padding:"10px 12px",background:"#f9fafb",borderRadius:8,borderLeft:"3px solid #fca5a5"}}>
                            <p style={{margin:"0 0 6px",fontSize:12,color:"#6b7280",fontWeight:600}}>Week ending {fmtDate(a.weekEnd)}</p>
                            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                              {absDays.map(d=><span key={d} className="dp-abs">{DAY_LABELS[d]}: {a[`${d}_absent`]}</span>)}
                              {lateDays.map(d=><span key={d} className="dp-late">{DAY_LABELS[d]}: {a[`${d}_lateReason`]} ({a[`${d}_lateHours`]}h)</span>)}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </>
              }
            </div>
          </div>
        );
      })()}

      {toast&&<div className={`toast ${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
