<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>nVent Workforce Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f4;color:#1a1a2e;min-height:100vh;}
    #root{max-width:1280px;margin:0 auto;padding:0 20px 40px;}

    button{font-family:inherit;font-size:13px;padding:7px 14px;border:1px solid #d0d5dd;background:#fff;color:#344054;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s;}
    button:hover{background:#f9fafb;border-color:#b0b7c3;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    button.primary{background:#E2001A;color:#fff;border-color:#E2001A;}
    button.primary:hover{background:#b8001a;}
    button.dark{background:#404040;color:#fff;border-color:#404040;}
    button.dark:hover{background:#555;}
    button.danger{color:#b91c1c;border-color:#fca5a5;}
    button.danger:hover{background:#fef2f2;}
    button.amber{color:#92400e;border-color:#fde68a;background:#fffbeb;}
    button.success{color:#065f46;border-color:#6ee7b7;background:#ecfdf5;}

    input,select{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #d0d5dd;border-radius:8px;color:#1a1a2e;background:#fff;width:100%;outline:none;transition:border-color .15s;}
    input:focus,select:focus{border-color:#E2001A;box-shadow:0 0 0 3px rgba(226,0,26,.1);}
    input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:#E2001A;}
    input[type="number"]{width:80px;}
    input[type="password"]{letter-spacing:2px;}

    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;}
    .nav{display:flex;align-items:center;gap:4px;border-bottom:2px solid #E2001A;margin-bottom:24px;padding-top:20px;}
    .nav-btn{border:none;border-radius:8px 8px 0 0;border-bottom:3px solid transparent;padding:10px 16px;font-size:14px;background:transparent;margin-bottom:-2px;}
    .nav-btn.active{border-bottom:3px solid #E2001A;color:#E2001A;font-weight:600;}

    .ts-header{display:grid;grid-template-columns:1.8fr 0.8fr 1fr 100px 200px 200px;gap:8px;padding:10px 16px;font-size:11px;color:#6b7280;font-weight:600;letter-spacing:.5px;border-bottom:1px solid #e5e7eb;}
    .ts-row{display:grid;grid-template-columns:1.8fr 0.8fr 1fr 100px 200px 200px;gap:8px;padding:10px 16px;align-items:center;font-size:13px;}
    .ts-row:nth-child(even){background:#f9fafb;}

    .toast{position:fixed;bottom:24px;right:24px;z-index:999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.12);}
    .toast.success{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;}
    .toast.error{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;}

    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
    .modal{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
    .modal-wide{max-width:700px;}

    .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
    .badge.green{background:#ecfdf5;color:#065f46;}
    .badge.red{background:#fef2f2;color:#991b1b;}
    .badge.blue{background:#eff6ff;color:#1d4ed8;}
    .badge.amber{background:#fffbeb;color:#92400e;}
    .badge.today{background:#fef3c7;color:#92400e;}
    .badge.gray{background:#f3f4f6;color:#6b7280;}
    .badge.nvent{background:#E2001A;color:#fff;}

    .prog-track{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden;}
    .prog-fill{height:5px;border-radius:3px;transition:width .5s ease;}

    .emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
    .emp-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
    .emp-card:hover{box-shadow:0 4px 16px rgba(226,0,26,.1);border-color:#E2001A;}
    .emp-card.inactive{opacity:.6;}
    .dept-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
    .dept-card{background:#f9fafb;border-radius:10px;padding:14px;border-left:3px solid #E2001A;}
    .avatar{width:38px;height:38px;border-radius:50%;background:#fff0f0;color:#E2001A;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;border:2px solid #fecaca;}

    .setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:14px;}
    label.field{display:block;font-size:12px;color:#6b7280;margin-bottom:5px;font-weight:500;text-align:left;}

    .att-section{border-radius:10px;padding:14px;margin-bottom:14px;}
    .att-section.abs-sec{background:#fef2f2;border:1px solid #fecaca;}
    .att-section.late-sec{background:#fffbeb;border:1px solid #fde68a;}
    .att-section.cov-sec{background:#ecfdf5;border:1px solid #6ee7b7;}
    .att-title{font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
    .att-row{display:grid;grid-template-columns:20px 90px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);}
    .att-row:last-child{border-bottom:none;}

    .dp-abs{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fef2f2;color:#991b1b;border:1px solid #fca5a5;}
    .dp-late{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
    .dp-cov{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;}

    .divider{display:flex;align-items:center;gap:12px;margin:28px 0 16px;}
    .divider-line{flex:1;height:1px;background:#e5e7eb;}
    .divider-label{font-size:11px;color:#9ca3af;font-weight:600;letter-spacing:.6px;white-space:nowrap;}

    .pending-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr auto;gap:8px;padding:10px 16px;align-items:center;font-size:13px;}
    .pending-row:nth-child(even){background:#f9fafb;}
    .pending-header{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr auto;gap:8px;padding:10px 16px;font-size:11px;color:#6b7280;font-weight:600;letter-spacing:.5px;border-bottom:1px solid #e5e7eb;}

    .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .stat-big{font-size:42px;font-weight:700;line-height:1;}
    .chart-wrap{position:relative;height:220px;}

    .nvent-header{background:#404040;padding:16px 20px;display:flex;align-items:center;gap:16px;border-radius:12px;margin-bottom:0;}
    .nvent-logo{height:36px;object-fit:contain;filter:brightness(0) invert(1);}
    .nvent-divider{width:1px;height:36px;background:rgba(255,255,255,.2);}
    .nvent-title{color:#fff;font-size:15px;font-weight:600;}
    .nvent-sub{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px;}
  </style>
</head>

const DEPARTMENTS  = ["Molding","VJ Assembly","CNC","Gasket","Paint"];
const DAYS         = ["monday","tuesday","wednesday","thursday","friday"];
const DAY_LABELS   = {monday:"Mon",tuesday:"Tue",wednesday:"Wed",thursday:"Thu",friday:"Fri"};
const ABS_REASONS  = ["Sick","No Call / No Show","Personal","Approved Leave","Other"];
const LATE_REASONS = ["Late Arrival","Left Early","Late Arrival & Left Early"];
const TERM_REASONS = ["Resigned","Terminated","Contract Ended","Retired","Other"];
const SHIFT_HOURS  = 8;
const SESSION_KEY  = "wt_session";
const TIMEOUT_MS   = 8*60*60*1000;

function getSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY));if(!s)return null;if(Date.now()-s.lastActivity>TIMEOUT_MS){localStorage.removeItem(SESSION_KEY);return null;}return s;}catch{return null;}}
function saveSession(d){localStorage.setItem(SESSION_KEY,JSON.stringify({...d,lastActivity:Date.now()}));}
function touchSession(){const s=getSession();if(s)saveSession(s);}
function getWeekEnd(o=0){const d=new Date(),s=new Date(d);s.setDate(d.getDate()+(6-d.getDay())+o*7);s.setHours(0,0,0,0);return s;}
function getWeekDates(sat){return DAYS.map((_,i)=>{const d=new Date(sat);d.setDate(sat.getDate()-5+i);return d.toLocaleDateString("en-US",{month:"numeric",day:"numeric"});});}
function fmtDate(iso){if(!iso)return"—";const p=String(iso).split("-");return p.length<3?(iso||"—"):`${p[1]}/${p[2]}/${p[0]}`;}
function daysUntilBirthday(b){if(!b)return null;const t=new Date();t.setHours(0,0,0,0);const p=String(b).split("-");if(p.length<3)return null;const n=new Date(t.getFullYear(),+p[1]-1,+p[2]);if(n<t)n.setFullYear(t.getFullYear()+1);return Math.round((n-t)/86400000);}
function initials(n=""){return n.trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();}
function calcHoursLost(abs){let h=0;DAYS.forEach(d=>{if(abs[`${d}_absent`]&&abs[`${d}_absent`]!=="")h+=SHIFT_HOURS;const lh=parseFloat(abs[`${d}_lateHours`]);if(!isNaN(lh)&&lh>0&&lh<=SHIFT_HOURS)h+=lh;});return Math.round(h*10)/10;}
function calcCoverage(covs){const o={},i={};DEPARTMENTS.forEach(d=>{o[d]=0;i[d]=0;});covs.forEach(c=>{DAYS.forEach(day=>{const td=c[`${day}_toDept`];const h=parseFloat(c[`${day}_hours`]);if(td&&!isNaN(h)&&h>0&&h<=SHIFT_HOURS){if(o[c.fromDept]!==undefined)o[c.fromDept]+=h;if(i[td]!==undefined)i[td]+=h;}});});return{out:o,inp:i};}

function BarChart({data, labels, color="#E2001A", title}){
  const ref = useRef();
  const chartRef = useRef();
  useEffect(()=>{
    if(!ref.current) return;
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current,{
      type:"bar",
      data:{labels,datasets:[{data,backgroundColor:color+"99",borderColor:color,borderWidth:2,borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:!!title,text:title,font:{size:13}}},scales:{y:{beginAtZero:true,grid:{color:"#f3f4f6"}},x:{grid:{display:false}}}}
    });
    return()=>{if(chartRef.current)chartRef.current.destroy();};
  },[data,labels,color,title]);
  return <canvas ref={ref}/>;
}

  const call=useCallback(async(params)=>{
    const url=localStorage.getItem("wt_gasUrl");if(!url)return null;
    try{const u=new URL(url);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,typeof v==="object"?JSON.stringify(v):String(v)));
    const res=await fetch(u.toString(),{redirect:"follow"});if(!res.ok)throw new Error("HTTP "+res.status);return await res.json();}
    catch(e){notify("Connection error: "+e.message,"error");return null;}
  },[]);

  const doLogin=async()=>{
    if(!loginForm.username||!loginForm.password){setLoginError("Enter username and password");return;}
    setLoginLoad(true);setLoginError("");
    const res=await call({action:"verifyLogin",username:loginForm.username,password:loginForm.password});
    setLoginLoad(false);
    if(res?.success){const s={username:res.username,role:res.role,lastActivity:Date.now()};saveSession(s);setSessionSt(s);setTimedOut(false);}
    else setLoginError(res?.error||"Invalid username or password");
  };
  const logout=()=>{localStorage.removeItem(SESSION_KEY);setSessionSt(null);setTimedOut(false);};

  const loadEmployees =useCallback(async()=>{setLoading(true);const d=await call({action:"getEmployees"});if(d?.employees)setEmployees(d.employees);setLoading(false);},[call]);
  const loadTimesheets=useCallback(async()=>{const d=await call({action:"getTimesheets",weekEnd:weekEndStr});if(d?.timesheets)setTimesheets(d.timesheets);},[call,weekEndStr]);
  const loadAbsences  =useCallback(async()=>{const d=await call({action:"getAbsences",weekEnd:weekEndStr});if(d?.absences)setAbsences(d.absences);},[call,weekEndStr]);
  const loadCoverages =useCallback(async()=>{const d=await call({action:"getCoverage",weekEnd:weekEndStr});if(d?.coverages)setCoverages(d.coverages);},[call,weekEndStr]);
  const loadPending   =useCallback(async()=>{const d=await call({action:"getPendingReports"});if(d?.reports)setPending(d.reports);},[call]);

  useEffect(()=>{if(session&&setupDone)loadEmployees();},[session,setupDone]);
  useEffect(()=>{if(session&&setupDone){loadTimesheets();loadAbsences();loadCoverages();loadPending();}},[session,setupDone,weekEndStr]);

  useEffect(()=>{
    if(tab==="reports"&&allAbsData.length===0&&!allAbsLoad){
      setAllAbsLoad(true);
      call({action:"getAllAbsencesAll"}).then(d=>{if(d?.absences)setAllAbsData(d.absences);setAllAbsLoad(false);});
    }
  },[tab]);

  const saveEmployee=async()=>{
    if(!form.name||!form.eid||!form.department){notify("Name, EID, Department required","error");return;}
    const res=await call({action:modal==="edit"?"updateEmployee":"addEmployee",data:{...form,status:form.status||"Active"}});
    if(res?.success){notify(modal==="edit"?"Employee updated":"Employee added");setModal(null);loadEmployees();}
    else notify(res?.error||"Save failed","error");
  };
  const deleteEmployee=async(eid,name)=>{if(!confirm(`Remove ${name}?`))return;const res=await call({action:"deleteEmployee",eid});if(res?.success){notify("Employee removed");loadEmployees();}};
  const openTerminate=emp=>{setTermModal(emp);setTermForm({lastDay:new Date().toISOString().split("T")[0],reason:"Resigned",rehireEligible:"Yes",notes:""}); };
  const saveTerminate=async()=>{
    if(!termForm.lastDay){notify("Last day required","error");return;}
    const res=await call({action:"terminateEmployee",data:{eid:termModal.eid,name:termModal.name,department:termModal.department,...termForm,terminatedAt:new Date().toISOString()}});
    if(res?.success){notify(`${termModal.name} marked inactive`);setTermModal(null);loadEmployees();}else notify("Failed","error");
  };
  const reactivate=async(eid,name)=>{if(!confirm(`Reactivate ${name}?`))return;const res=await call({action:"reactivateEmployee",eid});if(res?.success){notify(`${name} reactivated`);loadEmployees();}};

  const tsFor =eid=>timesheets.find(t=>t.eid===eid)||{};
  const absFor=eid=>absences.find(a=>a.eid===eid)||{};
  const covFor=eid=>coverages.find(c=>c.fromEid===eid)||{};

  const saveTs=async(emp,patch)=>{
    const cur=tsFor(emp.eid);
    const data={weekEnd:weekEndStr,eid:emp.eid,name:emp.name,department:emp.department,submitted:cur.submitted??false,submittedAt:cur.submittedAt??"",...patch};
    if(patch.submitted===true&&!cur.submitted)data.submittedAt=new Date().toISOString();
    if(patch.submitted===false)data.submittedAt="";
    const res=await call({action:"submitTimesheet",data});if(res?.success)loadTimesheets();else notify("Save failed","error");
  };

  const openAbsModal=emp=>{const cur=absFor(emp.eid);const f={};DAYS.forEach(d=>{f[`${d}_absent`]=cur[`${d}_absent`]||"";f[`${d}_lateReason`]=cur[`${d}_lateReason`]||"";f[`${d}_lateHours`]=cur[`${d}_lateHours`]||"";});setAbsForm(f);setAbsModal(emp);};
  const saveAbsences=async()=>{const res=await call({action:"saveAbsences",data:{weekEnd:weekEndStr,eid:absModal.eid,name:absModal.name,department:absModal.department,loggedAt:new Date().toISOString(),...absForm}});if(res?.success){notify("Attendance logged");setAbsModal(null);loadAbsences();}else notify("Save failed","error");};

  const openCovModal=emp=>{const cur=covFor(emp.eid);const f={};DAYS.forEach(d=>{f[`${d}_toDept`]=cur[`${d}_toDept`]||"";f[`${d}_hours`]=cur[`${d}_hours`]||"";});setCovForm(f);setCovModal(emp);};
  const saveCoverage=async()=>{const res=await call({action:"saveCoverage",data:{weekEnd:weekEndStr,fromEid:covModal.eid,fromName:covModal.name,fromDept:covModal.department,loggedAt:new Date().toISOString(),...covForm}});if(res?.success){notify("Coverage logged");setCovModal(null);loadCoverages();}else notify("Save failed","error");};

  const openProfile=async emp=>{setProfileEmp(emp);setProfileAbs([]);setProfileTerm(null);setProfileLoad(true);const[a,t]=await Promise.all([call({action:"getAllAbsences",eid:emp.eid}),call({action:"getTermination",eid:emp.eid})]);if(a?.absences)setProfileAbs(a.absences);if(t?.termination)setProfileTerm(t.termination);setProfileLoad(false);};

  const approvePending=async(id)=>{const res=await call({action:"approvePendingReport",id});if(res?.success){notify("Approved");loadPending();loadAbsences();}else notify("Failed","error");};
  const rejectPending =async(id)=>{const res=await call({action:"rejectPendingReport",id});if(res?.success){notify("Rejected");loadPending();}else notify("Failed","error");};

  const changePassword=async()=>{
    if(!pwForm.current||!pwForm.newPw){setPwError("Fill all fields");return;}
    if(pwForm.newPw!==pwForm.confirm){setPwError("Passwords do not match");return;}
    if(pwForm.newPw.length<4){setPwError("Password must be at least 4 characters");return;}
    const res=await call({action:"changePassword",username:session.username,currentPassword:pwForm.current,newPassword:pwForm.newPw});
    if(res?.success){notify("Password changed");setPwModal(false);setPwForm({current:"",newPw:"",confirm:""});setPwError("");}
    else setPwError(res?.error||"Failed — check your current password");
  };

  const sendReminder=async()=>{setSending(true);const res=await call({action:"sendReminder",weekEnd:weekEndStr});setSending(false);if(res?.success)notify("Reminder sent!");else notify("Failed","error");};

  const active    = employees.filter(e=>!e.status||e.status==="Active"||e.status==="");
  const inactive  = employees.filter(e=>e.status==="Inactive");
  const submitted = new Set(timesheets.filter(t=>t.submitted===true||t.submitted==="TRUE").map(t=>t.eid));
  const unsub     = active.filter(e=>!submitted.has(e.eid));
  const pct       = active.length?Math.round((submitted.size/active.length)*100):0;
  const birthdays = active.map(e=>({...e,days:daysUntilBirthday(e.birthday)})).filter(e=>e.days!==null&&e.days<=7).sort((a,b)=>a.days-b.days);
  const totalLost = absences.reduce((s,a)=>s+calcHoursLost(a),0);
  const totalAbsD = absences.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="").length,0);
  const totalLateD= absences.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_lateReason`]&&a[`${d}_lateReason`]!=="").length,0);
  const {out:covOut,inp:covInp}=calcCoverage(coverages);

  // Reports computed data
  const now = new Date();
  const rangeMs = reportRange==="week"?7:reportRange==="month"?30:90;
  const cutoff  = new Date(now.getTime()-rangeMs*86400000);
  const filteredAbs = allAbsData.filter(a=>{
    const p=String(a.weekEnd).split("-");
    if(p.length<3)return false;
    return new Date(+p[0],+p[1]-1,+p[2])>=cutoff;
  });

  // Hours lost by dept
  const hoursByDept={};DEPARTMENTS.forEach(d=>{hoursByDept[d]=0;});
  filteredAbs.forEach(a=>{if(hoursByDept[a.department]!==undefined)hoursByDept[a.department]+=calcHoursLost(a);});

  // Top absent employees
  const empAbsMap={};
  filteredAbs.forEach(a=>{
    if(!empAbsMap[a.eid])empAbsMap[a.eid]={name:a.name,dept:a.department,days:0,hours:0};
    empAbsMap[a.eid].days+=DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="").length;
    empAbsMap[a.eid].hours+=calcHoursLost(a);
  });
  const topAbsent=Object.values(empAbsMap).sort((a,b)=>b.hours-a.hours).slice(0,8);

  // Reason breakdown
  const reasonMap={};
  filteredAbs.forEach(a=>DAYS.forEach(d=>{if(a[`${d}_absent`]&&a[`${d}_absent`]!=="")reasonMap[a[`${d}_absent`]]=(reasonMap[a[`${d}_absent`]]||0)+1;}));

  // Temp vs FT from pending data (all time)
  const tempCount=pending.filter(p=>p.isTemp==="Temp").length;
  const ftCount  =pending.filter(p=>p.isTemp==="Full-Time").length;
  const wdYes    =pending.filter(p=>p.isTemp==="Full-Time"&&p.workday==="Yes").length;
  const wdNo     =pending.filter(p=>p.isTemp==="Full-Time"&&p.workday==="No").length;

  const totalReportHours=Object.values(hoursByDept).reduce((s,v)=>s+v,0);

  if(!setupDone) return(
    <div className="setup">
      <img src={NVENT_LOGO} style={{height:60,marginBottom:8}} alt="nVent"/>
      <h1 style={{fontSize:24,fontWeight:600}}>Workforce Tracker</h1>
      <p style={{color:"#6b7280",fontSize:14,maxWidth:380}}>Paste your Google Apps Script web app URL to connect.</p>
      <div style={{display:"flex",gap:8,width:"100%",maxWidth:520}}>
        <input value={urlDraft} onChange={e=>setUrlDraft(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(()=>{localStorage.setItem("wt_gasUrl",urlDraft.trim());setSetupDone(true);})()}  placeholder="https://script.google.com/macros/s/..."/>
        <button className="primary" onClick={()=>{localStorage.setItem("wt_gasUrl",urlDraft.trim());setSetupDone(true);}}>Connect</button>
      </div>
    </div>
  );

  if(!session) return(
    <div className="setup">
      <img src={NVENT_LOGO} style={{height:60,marginBottom:8}} alt="nVent"/>
      <h1 style={{fontSize:22,fontWeight:600,color:"#404040"}}>Workforce Tracker</h1>
      <p style={{fontSize:12,color:"#9ca3af"}}>nVent Hoffman — 2nd Shift</p>
      {timedOut&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:"10px 18px",fontSize:13,color:"#92400e"}}>Session expired after 8 hours</div>}
      <div style={{width:"100%",maxWidth:340,display:"flex",flexDirection:"column",gap:12}}>
        <div><label className="field">Username</label><input value={loginForm.username} onChange={e=>setLoginForm(p=>({...p,username:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doLogin()} autoFocus placeholder="Username"/></div>
        <div><label className="field">Password</label><input type="password" value={loginForm.password} onChange={e=>setLoginForm(p=>({...p,password:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&doLogin()} placeholder="Password"/></div>
        {loginError&&<p style={{fontSize:13,color:"#E2001A",textAlign:"center"}}>{loginError}</p>}
        <button className="primary" onClick={doLogin} disabled={loginLoad} style={{width:"100%",justifyContent:"center",padding:"10px"}}>{loginLoad?"Signing in...":"Sign in"}</button>
      </div>
      <p style={{fontSize:11,color:"#9ca3af"}}>Managed by nVent Hoffman 2nd Shift Operations</p>
    </div>
  );

  return(
    <div>
      <div className="nvent-header" style={{marginTop:20,borderRadius:"12px 12px 0 0"}}>
        <img src={NVENT_LOGO} className="nvent-logo" alt="nVent"/>
        <div className="nvent-divider"/>
        <div>
          <div className="nvent-title">Workforce Tracker</div>
          <div className="nvent-sub">Hoffman Division — 2nd Shift</div>
        </div>
        <div style={{flex:1}}/>
        {pending.length>0&&(
          <span style={{background:"#E2001A",color:"#fff",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:600,marginRight:8}}>
            {pending.length} pending
          </span>
        )}
        <span style={{fontSize:12,color:"rgba(255,255,255,.7)",marginRight:12,display:"flex",alignItems:"center",gap:6}}>
          <i className="ti ti-user" style={{fontSize:13}}/>{session.username}
          <span style={{padding:"2px 8px",background:"rgba(255,255,255,.15)",color:"#fff",borderRadius:20,fontSize:11,fontWeight:600}}>{session.role}</span>
        </span>
        <button onClick={()=>setPwModal(true)} style={{fontSize:12,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"#fff",marginRight:6}}>
          <i className="ti ti-lock" style={{fontSize:13}}/>
        </button>
        <button onClick={logout} style={{fontSize:12,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"#fff"}}>
          <i className="ti ti-logout" style={{fontSize:13}}/> Logout
        </button>
      </div>

      <div className="nav">
        {[{id:"dashboard",icon:"ti-layout-dashboard",label:"Dashboard"},
          {id:"employees", icon:"ti-users",           label:"Employees"},
          {id:"timesheets",icon:"ti-clipboard-check", label:"Timesheets"},
          {id:"reports",   icon:"ti-chart-bar",       label:"Reports"},
        ].map(({id,icon,label})=>(
          <button key={id} className={`nav-btn ${tab===id?"active":""}`} onClick={()=>setTab(id)}>
            <i className={`ti ${icon}`} style={{fontSize:15}}/> {label}
            {id==="timesheets"&&pending.length>0&&<span style={{background:"#E2001A",color:"#fff",borderRadius:20,padding:"1px 7px",fontSize:10,fontWeight:700}}>{pending.length}</span>}
          </button>
        ))}
      </div>

      {/* ── DASHBOARD ── */}
      {tab==="dashboard"&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div style={{gridColumn:"1/-1",display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
            <button onClick={()=>setWeekOff(w=>w-1)} style={{padding:"7px 11px"}}><i className="ti ti-chevron-left"/></button>
            <div><p style={{margin:0,fontSize:11,color:"#9ca3af"}}>Week ending</p><p style={{margin:0,fontWeight:600,fontSize:15}}>{weekEnd.toLocaleDateString("en-US",{weekday:"short",month:"long",day:"numeric",year:"numeric"})}</p></div>
            <button onClick={()=>setWeekOff(w=>w+1)} style={{padding:"7px 11px"}}><i className="ti ti-chevron-right"/></button>
            {weekOff!==0&&<button onClick={()=>setWeekOff(0)}>Current week</button>}
          </div>

          <div className="card">
            <p style={{fontSize:11,color:"#9ca3af",fontWeight:600,letterSpacing:.6,marginBottom:14}}>THIS WEEK — TIMESHEETS</p>
            <div style={{display:"flex",alignItems:"baseline",gap:6,marginBottom:6}}>
              <span className="stat-big" style={{color:pct===100?"#065f46":"#E2001A"}}>{submitted.size}</span>
              <span style={{fontSize:20,color:"#9ca3af"}}>/ {active.length}</span>
            </div>
            <p style={{fontSize:13,color:"#6b7280",marginBottom:14}}>submitted this week</p>
            <div className="prog-track" style={{marginBottom:12}}><div className="prog-fill" style={{width:`${pct}%`,background:pct===100?"#10b981":"#E2001A"}}/></div>
            {unsub.length>0&&<div style={{padding:"10px 12px",background:"#fef2f2",borderRadius:8,fontSize:12,color:"#991b1b",display:"flex",alignItems:"center",gap:6}}><i className="ti ti-alert-triangle" style={{fontSize:14}}/>{unsub.length} pending — Tue 10:00 AM</div>}
            {pct===100&&active.length>0&&<div style={{padding:"10px 12px",background:"#ecfdf5",borderRadius:8,fontSize:12,color:"#065f46",display:"flex",alignItems:"center",gap:6}}><i className="ti ti-circle-check" style={{fontSize:14}}/> All submitted!</div>}
          </div>

          <div className="card">
            <p style={{fontSize:11,color:"#9ca3af",fontWeight:600,letterSpacing:.6,marginBottom:14}}><i className="ti ti-cake" style={{fontSize:12,marginRight:5}}/>UPCOMING BIRTHDAYS (7 DAYS)</p>
            {birthdays.length===0?<p style={{fontSize:13,color:"#9ca3af"}}>No birthdays in the next 7 days</p>
              :birthdays.map(e=>(
                <div key={e.eid} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f3f4f6"}}>
                  <div><p style={{margin:0,fontWeight:600,fontSize:14}}>{e.name}</p><p style={{margin:0,fontSize:12,color:"#6b7280"}}>{e.department} · {fmtDate(e.birthday)}</p></div>
                  <span className={`badge ${e.days===0?"today":"blue"}`}>{e.days===0?"🎂 Today!":`In ${e.days}d`}</span>
                </div>
              ))}
          </div>

          <div className="card">
            <p style={{fontSize:11,color:"#9ca3af",fontWeight:600,letterSpacing:.6,marginBottom:14}}><i className="ti ti-clock-x" style={{fontSize:12,marginRight:5}}/>MAN HOURS LOST — 2ND SHIFT</p>
            <div style={{display:"flex",alignItems:"baseline",gap:6,marginBottom:14}}>
              <span className="stat-big" style={{color:totalLost>0?"#E2001A":"#065f46"}}>{totalLost}</span>
              <span style={{fontSize:16,color:"#9ca3af"}}>hrs this week</span>
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div style={{background:"#fef2f2",borderRadius:8,padding:"8px 14px"}}><p style={{margin:0,fontSize:10,color:"#991b1b",fontWeight:600}}>ABSENT</p><p style={{margin:0,fontSize:22,fontWeight:700,color:"#991b1b"}}>{totalAbsD}d</p></div>
              <div style={{background:"#fffbeb",borderRadius:8,padding:"8px 14px"}}><p style={{margin:0,fontSize:10,color:"#92400e",fontWeight:600}}>LATE/LEFT</p><p style={{margin:0,fontSize:22,fontWeight:700,color:"#92400e"}}>{totalLateD}d</p></div>
            </div>
          </div>

          <div className="card" style={{gridColumn:"1/-1"}}>
            <p style={{fontSize:11,color:"#9ca3af",fontWeight:600,letterSpacing:.6,marginBottom:16}}>DEPARTMENT BREAKDOWN</p>
            <div className="dept-grid">
              {DEPARTMENTS.map(dept=>{
                const dE=active.filter(e=>e.department===dept);
                const dS=dE.filter(e=>submitted.has(e.eid)).length;
                const dp=dE.length?Math.round((dS/dE.length)*100):0;
                const dA=absences.filter(a=>a.department===dept).reduce((s,a)=>s+calcHoursLost(a),0);
                const dO=covOut[dept]||0,dI=covInp[dept]||0;
                const net=Math.round((dA+dO-dI)*10)/10;
                return(
                  <div key={dept} className="dept-card">
                    <p style={{margin:"0 0 4px",fontSize:10,color:"#9ca3af",fontWeight:600,letterSpacing:.5}}>{dept.toUpperCase()}</p>
                    <p style={{margin:"0 0 8px",fontSize:22,fontWeight:700}}>{dS}<span style={{fontSize:13,color:"#9ca3af",fontWeight:400}}>/{dE.length}</span></p>
                    <div className="prog-track" style={{marginBottom:8}}><div className="prog-fill" style={{width:`${dp}%`,background:dp===100?"#10b981":"#E2001A"}}/></div>
                    {dA>0&&<p style={{fontSize:10,color:"#991b1b",margin:"2px 0",fontWeight:600}}><i className="ti ti-clock-x" style={{fontSize:9}}/> {dA}h lost</p>}
                    {dO>0&&<p style={{fontSize:10,color:"#92400e",margin:"2px 0",fontWeight:600}}><i className="ti ti-arrow-right" style={{fontSize:9}}/> {dO}h out</p>}
                    {dI>0&&<p style={{fontSize:10,color:"#065f46",margin:"2px 0",fontWeight:600}}><i className="ti ti-arrow-left" style={{fontSize:9}}/> {dI}h in</p>}
                    {net>0&&<p style={{fontSize:11,color:"#E2001A",margin:"6px 0 0",fontWeight:700,borderTop:"1px solid #e5e7eb",paddingTop:5}}>Net: -{net}h</p>}
                    {net<=0&&(dA>0||dI>0)&&<p style={{fontSize:11,color:"#065f46",margin:"6px 0 0",fontWeight:700,borderTop:"1px solid #e5e7eb",paddingTop:5}}>✓ Covered</p>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ── EMPLOYEES ── */}
      {tab==="employees"&&(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <p style={{color:"#6b7280",fontSize:13}}>{loading?"Loading...":`${active.length} active · ${inactive.length} inactive`}</p>
            {isAdmin&&<button className="primary" onClick={()=>{setForm({department:DEPARTMENTS[0],status:"Active"});setModal("add");}}><i className="ti ti-plus" style={{fontSize:14}}/> Add employee</button>}
          </div>
          {DEPARTMENTS.map(dept=>{
            const dE=active.filter(e=>e.department===dept);if(!dE.length)return null;
            return(
              <div key={dept} style={{marginBottom:28}}>
                <p style={{margin:"0 0 10px",fontSize:11,color:"#6b7280",fontWeight:600,letterSpacing:.6}}>{dept.toUpperCase()} · {dE.length}</p>
                <div className="emp-grid">
                  {dE.map(emp=>(
                    <div key={emp.eid} className="emp-card" onClick={()=>openProfile(emp)}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                        <div className="avatar">{initials(emp.name)}</div>
                        <div style={{minWidth:0}}>
                          <p style={{margin:0,fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{emp.name}</p>
                          <p style={{margin:0,fontSize:11,color:"#9ca3af",fontFamily:"monospace"}}>EID: {emp.eid}</p>
                        </div>
                      </div>
                      <div style={{fontSize:12,color:"#6b7280",display:"flex",flexDirection:"column",gap:4,marginBottom:12}}>
                        {emp.jobTitle&&<span><i className="ti ti-briefcase" style={{fontSize:11,marginRight:4}}/>{emp.jobTitle}</span>}
                        {emp.hireDate&&<span><i className="ti ti-calendar-plus" style={{fontSize:11,marginRight:4}}/>Hired {fmtDate(emp.hireDate)}</span>}
                        {emp.birthday&&<span><i className="ti ti-cake" style={{fontSize:11,marginRight:4}}/>{fmtDate(emp.birthday)}</span>}
                        {emp.phone&&<span><i className="ti ti-phone" style={{fontSize:11,marginRight:4}}/>{emp.phone}</span>}
                      </div>

                      <span style={{fontSize:13,fontWeight:700,color:covInp[d]>0?"#065f46":"#9ca3af"}}>{covInp[d]||0}h received</span>

              <div className="att-title" style={{color:"#92400e"}}><i className="ti ti-clock-exclamation" style={{fontSize:14}}/> LATE / LEFT EARLY — enter hours lost</div>
              {DAYS.map((day,i)=>(
                <div key={`l${day}`} className="att-row">
                  <input type="checkbox" checked={!!absForm[`${day}_lateReason`]} onChange={e=>setAbsForm(p=>({...p,[`${day}_lateReason`]:e.target.checked?LATE_REASONS[0]:"",[`${day}_lateHours`]:e.target.checked?"1":""}))}/>
                  <span style={{fontSize:13,fontWeight:600}}>{DAY_LABELS[day]} <span style={{fontWeight:400,color:"#9ca3af",fontSize:11}}>{weekDates[i]}</span></span>
                  {absForm[`${day}_lateReason`]?<div style={{display:"flex",gap:6,alignItems:"center"}}><select value={absForm[`${day}_lateReason`]} onChange={e=>setAbsForm(p=>({...p,[`${day}_lateReason`]:e.target.value}))} style={{flex:1}}>{LATE_REASONS.map(r=><option key={r} value={r}>{r}</option>)}</select><input type="number" min="0.5" max="7.5" step="0.5" value={absForm[`${day}_lateHours`]||""} onChange={e=>setAbsForm(p=>({...p,[`${day}_lateHours`]:e.target.value}))} style={{width:55}} placeholder="hrs"/><span style={{fontSize:11,color:"#9ca3af"}}>h</span></div>:<span style={{fontSize:12,color:"#d1d5db",fontStyle:"italic"}}>On time</span>}
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={()=>setAbsModal(null)}>Cancel</button><button className="primary" onClick={saveAbsences}>Save</button></div>
          </div>
        </div>
      )}

      {covModal&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setCovModal(null);}}>
          <div className="modal">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <h2 style={{fontSize:18,fontWeight:600}}>Log coverage</h2>
              <button onClick={()=>setCovModal(null)} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
            </div>
            <p style={{fontSize:13,color:"#6b7280",marginBottom:20}}><strong>{covModal?.name}</strong> · {covModal?.department}<br/><span style={{fontSize:12}}>Week of {weekDates[0]} – {weekDates[4]}</span></p>
            <div className="att-section cov-sec">
              <div className="att-title" style={{color:"#065f46"}}><i className="ti ti-arrow-left-right" style={{fontSize:14}}/> COVERAGE BY DAY</div>
              {DAYS.map((day,i)=>{
                const other=DEPARTMENTS.filter(d=>d!==covModal?.department);
                return(
                  <div key={day} className="att-row">
                    <input type="checkbox" checked={!!covForm[`${day}_toDept`]} onChange={e=>setCovForm(p=>({...p,[`${day}_toDept`]:e.target.checked?other[0]:"",[`${day}_hours`]:e.target.checked?"8":""}))}/>
                    <span style={{fontSize:13,fontWeight:600}}>{DAY_LABELS[day]} <span style={{fontWeight:400,color:"#9ca3af",fontSize:11}}>{weekDates[i]}</span></span>
                    {covForm[`${day}_toDept`]?<div style={{display:"flex",gap:6,alignItems:"center"}}><select value={covForm[`${day}_toDept`]} onChange={e=>setCovForm(p=>({...p,[`${day}_toDept`]:e.target.value}))} style={{flex:1}}>{other.map(d=><option key={d} value={d}>{d}</option>)}</select><input type="number" min="1" max="8" step="0.5" value={covForm[`${day}_hours`]||""} onChange={e=>setCovForm(p=>({...p,[`${day}_hours`]:e.target.value}))} style={{width:55}} placeholder="hrs"/><span style={{fontSize:11,color:"#9ca3af"}}>h</span></div>:<span style={{fontSize:12,color:"#9ca3af",fontStyle:"italic"}}>Not covering</span>}
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={()=>setCovModal(null)}>Cancel</button><button className="primary" onClick={saveCoverage}>Save coverage</button></div>
          </div>
        </div>
      )}

      {pwModal&&(
        <div className="overlay" onClick={e=>{if(e.target===e.currentTarget){setPwModal(false);setPwError("");}}}>
          <div className="modal" style={{maxWidth:380}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h2 style={{fontSize:18,fontWeight:600}}>Change password</h2>
              <button onClick={()=>{setPwModal(false);setPwError("");}} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div><label className="field">Current password</label><input type="password" value={pwForm.current} onChange={e=>setPwForm(p=>({...p,current:e.target.value}))}/></div>
              <div><label className="field">New password</label><input type="password" value={pwForm.newPw} onChange={e=>setPwForm(p=>({...p,newPw:e.target.value}))}/></div>
              <div><label className="field">Confirm new password</label><input type="password" value={pwForm.confirm} onChange={e=>setPwForm(p=>({...p,confirm:e.target.value}))}/></div>
              {pwError&&<p style={{fontSize:13,color:"#E2001A"}}>{pwError}</p>}
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:20}}>
              <button onClick={()=>{setPwModal(false);setPwError("");}}>Cancel</button>
              <button className="primary" onClick={changePassword}><i className="ti ti-lock" style={{fontSize:13}}/> Change password</button>
            </div>
          </div>
        </div>
      )}

      {profileEmp&&(()=>{
        const isInact=profileEmp.status==="Inactive";
        const totDays=profileAbs.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="").length,0);
        const totLate=profileAbs.reduce((s,a)=>s+DAYS.filter(d=>a[`${d}_lateReason`]&&a[`${d}_lateReason`]!=="").length,0);
        const totHrs =profileAbs.reduce((s,a)=>s+calcHoursLost(a),0);
        const rc={};profileAbs.forEach(a=>DAYS.forEach(d=>{if(a[`${d}_absent`]&&a[`${d}_absent`]!=="")rc[a[`${d}_absent`]]=(rc[a[`${d}_absent`]]||0)+1;}));
        return(
          <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setProfileEmp(null);}}>
            <div className="modal" style={{maxWidth:540}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div className="avatar" style={{width:48,height:48,fontSize:16,background:isInact?"#f3f4f6":"#fff0f0",color:isInact?"#9ca3af":"#E2001A",border:`2px solid ${isInact?"#e5e7eb":"#fecaca"}`}}>{initials(profileEmp.name)}</div>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <h2 style={{fontSize:18,fontWeight:600,margin:0}}>{profileEmp.name}</h2>
                      {isInact&&<span className="badge gray">Inactive</span>}
                    </div>
                    <p style={{margin:0,fontSize:12,color:"#6b7280"}}>{profileEmp.department} · EID: {profileEmp.eid}</p>
                  </div>
                </div>
                <button onClick={()=>setProfileEmp(null)} style={{border:"none",background:"none",padding:4}}><i className="ti ti-x" style={{fontSize:18,color:"#9ca3af"}}/></button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,padding:14,background:"#f9fafb",borderRadius:10,marginBottom:16}}>
                {[["Job Title",profileEmp.jobTitle],["Phone",profileEmp.phone],["Hire Date",fmtDate(profileEmp.hireDate)],["Birthday",fmtDate(profileEmp.birthday)]].filter(([,v])=>v&&v!=="—").map(([l,v])=>(
                  <div key={l}><p style={{margin:0,fontSize:10,color:"#9ca3af",fontWeight:600,letterSpacing:.5}}>{l.toUpperCase()}</p><p style={{margin:0,fontSize:13}}>{v}</p></div>
                ))}
              </div>
              {isInact&&profileTerm&&(
                <div style={{padding:14,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,marginBottom:16}}>
                  <p style={{margin:"0 0 10px",fontSize:11,color:"#92400e",fontWeight:600,letterSpacing:.5}}>TERMINATION DETAILS</p>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {[["Last Day",fmtDate(profileTerm.lastDay)],["Reason",profileTerm.reason],["Rehire Eligible",profileTerm.rehireEligible],["Notes",profileTerm.notes||"—"]].map(([l,v])=>(
                      <div key={l} style={l==="Notes"?{gridColumn:"1/-1"}:{}}><p style={{margin:0,fontSize:10,color:"#92400e",fontWeight:600}}>{l.toUpperCase()}</p><p style={{margin:0,fontSize:13}}>{v}</p></div>
                    ))}
                  </div>
                </div>
              )}
              <p style={{fontSize:11,color:"#9ca3af",fontWeight:600,letterSpacing:.6,marginBottom:12}}>ATTENDANCE HISTORY</p>
              {profileLoad?<p style={{fontSize:13,color:"#9ca3af",textAlign:"center",padding:"20px 0"}}>Loading...</p>
                :totDays===0&&totLate===0?<div style={{textAlign:"center",padding:"20px 0",color:"#9ca3af"}}><i className="ti ti-circle-check" style={{fontSize:32,display:"block",marginBottom:8,color:"#10b981"}}/><p style={{fontSize:13}}>No absences on record</p></div>
                :<>
                  <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
                    {[{l:"Absent days",v:totDays,bg:"#fef2f2",c:"#991b1b"},{l:"Late/Left",v:totLate,bg:"#fffbeb",c:"#92400e"},{l:"Hours lost",v:`${totHrs}h`,bg:"#f3f4f6",c:"#374151"},...Object.entries(rc).map(([r,c])=>({l:r,v:c,bg:"#fef2f2",c:"#991b1b"}))].map(({l,v,bg,c})=>(
                      <div key={l} style={{background:bg,borderRadius:10,padding:"8px 14px"}}><p style={{margin:0,fontSize:10,color:c,fontWeight:600}}>{l.toUpperCase()}</p><p style={{margin:0,fontSize:22,fontWeight:700,color:c}}>{v}</p></div>
                    ))}
                  </div>
                  <div style={{maxHeight:180,overflowY:"auto",display:"flex",flexDirection:"column",gap:8}}>
                    {[...profileAbs].reverse().map((a,i)=>{
                      const aD=DAYS.filter(d=>a[`${d}_absent`]&&a[`${d}_absent`]!=="");
                      const lD=DAYS.filter(d=>a[`${d}_lateReason`]&&a[`${d}_lateReason`]!=="");
                      if(!aD.length&&!lD.length)return null;
                      return(
                        <div key={i} style={{padding:"10px 12px",background:"#f9fafb",borderRadius:8,borderLeft:"3px solid #E2001A"}}>
                          <p style={{margin:"0 0 6px",fontSize:12,color:"#6b7280",fontWeight:600}}>Week ending {fmtDate(a.weekEnd)}</p>
                          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                            {aD.map(d=><span key={d} className="dp-abs">{DAY_LABELS[d]}: {a[`${d}_absent`]}</span>)}
                            {lD.map(d=><span key={d} className="dp-late">{DAY_LABELS[d]}: {a[`${d}_lateReason`]} ({a[`${d}_lateHours`]}h)</span>)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              }
            </div>
          </div>
        );
      })()}

      {toast&&<div className={`toast ${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
